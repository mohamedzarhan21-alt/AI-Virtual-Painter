[project]
name = "ai-virtual-painter"
version = "1.0.0"
description = "A holographic air-drawing studio driven by real-time hand tracking."
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.9",
    "mediapipe>=0.10.30",
    "numpy>=1.26",
    "Pillow>=10.0",
    "customtkinter>=5.2",
]

[project.scripts]
ai-virtual-painter = "ai_virtual_painter:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PL"]
ignore = [
    "PLR0913",  # brush renderers share a deliberate six-argument protocol
    "PLR2004",  # rendering code is full of intentional geometric literals
    "PLR0912",  # the HUD command dispatcher is a flat, readable branch table
    "PLR0915",  # a few HUD painters are long but strictly linear
    "PLR0911",
    "RUF001",   # the interface deliberately uses typographic glyphs
    "RUF003",
    "N999",
    # Theme's defaults call hex_to_bgr, a pure function returning an immutable
    # tuple, so the shared-mutable-default hazard this rule guards cannot occur.
    "RUF009",
]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
